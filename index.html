<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Jogo de Geografia: leia o climograma e descubra a cidade. 105 cidades, 3 níveis, cronômetro, ranking e explicação da classificação de Köppen-Geiger. Por Prof. Felippe."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230A3C52' stroke='%23F2A900' stroke-width='3'/%3E%3Cg fill='%237DBDEB'%3E%3Crect x='15' y='36' width='6' height='10' rx='1.5'/%3E%3Crect x='23' y='32' width='6' height='14' rx='1.5'/%3E%3Crect x='31' y='29' width='6' height='17' rx='1.5'/%3E%3Crect x='39' y='34' width='6' height='12' rx='1.5'/%3E%3Crect x='47' y='38' width='6' height='8' rx='1.5'/%3E%3C/g%3E%3Cpolyline points='18,27 26,22 34,17 42,22.500000 50,27.500000' fill='none' stroke='%23FF8470' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Climograma Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;600&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{
  --bg:#F4EFE1;--bgg:rgba(23,40,58,.06);--card:#FFFDF7;--card2:#F8F3E5;--ink:#17283A;--mut:#566676;--line:#D8CFB7;--grid:#E3DBC4;
  --hero1:#0B4F6C;--hero2:#0B7078;--onhero:#FFFFFF;
  --brand:#0B6E75;--amber:#F2A900;--amberd:#B07800;--onamber:#1D1600;
  --rain:#2B7BBA;--rain2:#7DBDEB;--temp:#D63A2B;
  --ok:#1B7A4B;--okbg:#DDF3E6;--bad:#B3341F;--badbg:#FBE4DF;
  --shadow:0 1px 0 rgba(23,40,58,.06),0 14px 28px -18px rgba(23,40,58,.45);
  --kA:#C0391B;--kB:#EDB92E;--kC:#36803A;--kD:#33709C;--kE:#5E6F86;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Nunito",ui-rounded,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1522;--bgg:rgba(150,195,230,.06);--card:#112133;--card2:#0E1C2C;--ink:#E8EEF6;--mut:#9DB0C3;--line:#26405A;--grid:#1D3247;
  --hero1:#0E3A52;--hero2:#0B5560;--onhero:#FFFFFF;
  --brand:#3CC3BC;--amber:#FFC83D;--amberd:#A67600;--onamber:#1B1400;
  --rain:#3F93D8;--rain2:#8CCBF5;--temp:#FF8470;
  --ok:#4FD69C;--okbg:#113A2B;--bad:#FF8F85;--badbg:#42211F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1522;--bgg:rgba(150,195,230,.06);--card:#112133;--card2:#0E1C2C;--ink:#E8EEF6;--mut:#9DB0C3;--line:#26405A;--grid:#1D3247;
  --hero1:#0E3A52;--hero2:#0B5560;--onhero:#FFFFFF;
  --brand:#3CC3BC;--amber:#FFC83D;--amberd:#A67600;--onamber:#1B1400;
  --rain:#3F93D8;--rain2:#8CCBF5;--temp:#FF8470;
  --ok:#4FD69C;--okbg:#113A2B;--bad:#FF8F85;--badbg:#42211F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--bgg) 1px,transparent 1px),linear-gradient(90deg,var(--bgg) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:900;text-wrap:balance;letter-spacing:-.01em}
.wrap{width:100%;max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.mu{color:var(--mut)}
.small{font-size:.88rem}

/* cabeçalho */
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--onhero);position:relative;overflow:hidden;border-bottom:4px solid var(--amber)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:300px;height:300px;border-radius:50%;border:1px dashed rgba(255,255,255,.28);box-shadow:inset 0 0 0 28px rgba(255,255,255,.04),inset 0 0 0 29px rgba(255,255,255,.18),inset 0 0 0 60px rgba(255,255,255,.03);pointer-events:none}
.hero-in{display:flex;align-items:center;gap:16px;padding-block:20px 22px;position:relative;z-index:1}
.emb{flex:none;width:68px;height:68px}
.hero-tx{min-width:0;flex:1}
.kick{font:600 .72rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.05;margin:4px 0 4px}
.tag{opacity:.92;max-width:46ch}
.by{flex:none;display:inline-block;transform:rotate(-3deg);padding:5px 14px;border:2px solid var(--amber);border-radius:10px;color:var(--amber);font:600 .85rem var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.14);white-space:nowrap}
body.compact .hero-in{padding-block:10px}
body.compact .emb{width:40px;height:40px}
body.compact .kick,body.compact .tag{display:none}
body.compact .hero h1{font-size:1.3rem;margin:0}
body.compact .by{font-size:.72rem;padding:3px 10px}
body.compact .hero::after{display:none}
@media (max-width:620px){
  .hero-in{flex-wrap:wrap;gap:10px 12px;align-items:flex-start}
  .hero-tx{flex:1 1 220px}
  .kick{font-size:.64rem;letter-spacing:.09em}
  .by{order:3;margin-left:68px;margin-top:2px}
  .emb{width:56px;height:56px}
  body.compact .hero-in{flex-wrap:nowrap;align-items:center}
  body.compact .hero-tx{flex:1 1 0}
  body.compact .by{order:0;margin:0}
}

main{padding-block:22px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative}
.card+.card{margin-top:16px}
.lab{font:600 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:10px;display:block}
.card h2{font-size:1.35rem;line-height:1.2;margin-bottom:8px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid2>.card{margin:0}
.stack{display:grid;gap:16px;align-content:start}
.stack>.card{margin:0}
@media (min-width:900px){
  .grid2.home{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .grid2.play{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .card{padding:24px}
}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;border:0;background:var(--amber);color:var(--onamber);font-weight:800;box-shadow:0 4px 0 var(--amberd);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--amberd)}
.btn.big{width:100%;font-size:1.08rem;padding:14px 22px;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:700;padding:10px 18px}
.btn.ghost:hover:not(:disabled){border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:8px 14px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
a.btn{text-decoration:none}
a.lnk{color:var(--brand);font-weight:700;text-underline-offset:3px}

/* Köppen-Geiger */
.kop{grid-column:1/-1}
.kop-top{display:grid;gap:12px;align-items:center}
.kop-links{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.kop details{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.kop summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px;width:fit-content;padding:4px 0}
.kop summary::-webkit-details-marker{display:none}
.kop summary::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--brand);border-bottom:2.5px solid var(--brand);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.kop details[open] summary::before{transform:rotate(45deg)}
.kgrid{display:grid;gap:18px;margin:12px 0 4px}
.kcol h4{font:600 .72rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.kcol ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.kcol li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:.9rem;line-height:1.4}
.kb{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 4px;border-radius:7px;font:700 .85rem var(--mono);color:#fff;background:var(--kE)}
.kb.A{background:var(--kA)}.kb.B{background:var(--kB);color:#1D1600}.kb.C{background:var(--kC)}.kb.D{background:var(--kD)}.kb.E{background:var(--kE)}
.kb.n{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.kcol li b{font-weight:800}
.kex{display:grid;gap:6px;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
@media (min-width:760px){.kop-top{grid-template-columns:minmax(0,1fr) auto}.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* níveis */
.lvs{display:grid;gap:10px;margin:6px 0 4px}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .12s,transform .12s}
.lv:hover{border-color:var(--brand)}
.lv[aria-pressed="true"]{border-color:var(--amber);background:var(--card2);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 30%,transparent)}
.lv .th{grid-row:span 2;width:26px;height:40px}
.lv b{font:900 1.1rem var(--serif)}
.lv small{color:var(--mut);display:block;line-height:1.35}
.th .tb{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.th .hg{fill:var(--temp)}
.th1 .hg{fill:var(--rain)}.th2 .hg{fill:var(--amber)}
.sw{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;margin-top:10px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .knob{flex:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw .knob::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked+.knob{background:var(--brand)}
.sw input:checked+.knob::after{transform:translateX(20px)}
.sw input:focus-visible+.knob{outline:3px solid var(--brand);outline-offset:2px}
.sw b{display:block}
.sw small{display:block;color:var(--mut);line-height:1.35}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.84rem;font-weight:700}
.chip i{display:inline-block}
.chip .a{width:12px;height:12px;border-radius:3px;background:var(--rain)}
.chip .b{width:16px;height:4px;border-radius:2px;background:var(--temp)}
.pbar{height:10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--rain),var(--brand));border-radius:99px}
.steps-list{margin:0;padding-left:1.1rem;display:grid;gap:4px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.hud-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:.88rem;white-space:nowrap}
.pill.hot{background:var(--amber);color:var(--onamber);border-color:transparent;animation:pp .4s}
.pill.xit{cursor:pointer;color:var(--mut);padding:2px 10px}
.pill.xit:hover{border-color:var(--brand);color:var(--ink)}
.pill.xit.ask{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.plot:focus-visible{outline-offset:-2px}
.ficha{font:600 .85rem var(--mono);letter-spacing:.04em}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--brand)}.steps i.c{background:var(--amber)}
.thermo{display:flex;align-items:center;gap:0;margin-top:9px}
.thermo .bulb{flex:none;width:20px;height:20px;border-radius:50%;background:var(--merc);border:2px solid var(--ink);position:relative;z-index:1}
.thermo .tube{flex:1;height:12px;border-radius:0 99px 99px 0;border:2px solid var(--ink);border-left:0;background:var(--card);overflow:hidden;margin-left:-6px}
.thermo .mer{height:100%;width:0;background:var(--merc);transition:width .12s linear}
.thermo b{font:600 .92rem var(--mono);min-width:4.2ch;text-align:right;margin-left:10px}
.thermo.low b{color:var(--bad)}

/* gráfico */
.q{font-size:1.2rem;line-height:1.25;margin-bottom:10px}
.plot{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 6px 4px;min-height:240px;touch-action:pan-y}
.plot svg{display:block;width:100%;height:auto;overflow:visible;user-select:none}
.plot text{font-family:var(--mono);font-size:11px;fill:var(--mut)}
.plot text.tc{fill:var(--temp);font-weight:600;font-size:11.5px}
.plot text.pc{fill:var(--rain);font-weight:600;font-size:11.5px}
.plot .gl{stroke:var(--grid);stroke-width:1}
.plot .gz{stroke:var(--mut);stroke-width:1;stroke-dasharray:4 4;opacity:.8}
.plot .ax{stroke:var(--ink);stroke-width:1.2;opacity:.55}
.plot .hl{fill:var(--amber);opacity:0}
.plot .hl.on{opacity:.2}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:gr .8s cubic-bezier(.2,.9,.25,1) both}
.ln{stroke-dasharray:1 2;stroke-dashoffset:1;animation:dr 1.1s .4s ease forwards}
.dt{animation:pp .35s both;transform-box:fill-box;transform-origin:center}
.still .bar,.still .ln,.still .dt{animation:none}
.still .ln{stroke-dasharray:none;stroke-dashoffset:0}
.readout{min-height:2.4em;margin-top:8px;font:500 .88rem/1.4 var(--mono);color:var(--mut);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.readout b{color:var(--ink)}
.readout .rt{color:var(--temp);font-weight:600}
.readout .rp{color:var(--rain);font-weight:600}
.legend{margin-top:8px}

/* opções */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;min-height:58px;border:2px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .1s,opacity .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brand)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt .let{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:600 .95rem var(--mono)}
.opt .nm{min-width:0;font:900 1.08rem/1.2 var(--serif)}
.opt small{display:block;font:500 .78rem/1.3 var(--mono);color:var(--mut);margin-top:2px;letter-spacing:.02em}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok);animation:pp .5s}
.opt.ok .let{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.no{background:var(--badbg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:sk .4s}
.opt.no .let{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.hintrow{margin-top:14px}
.hint{margin-top:10px;padding:10px 14px;border-left:4px solid var(--amber);background:var(--card2);border-radius:0 10px 10px 0;font-size:.95rem}
.hint[hidden]{display:none}
.ph{margin:10px 0 2px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.ph .bx{position:relative;height:clamp(180px,42vw,260px);background:var(--card2);overflow:hidden}
.ph img{display:block}
.ph .bg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);object-fit:cover;filter:blur(14px) saturate(1.1);opacity:.75}
.ph .fg{position:relative;width:100%;height:100%;object-fit:contain}
.ph.cv .fg{object-fit:cover;object-position:center 40%}
.ph.cv .bg{display:none}
.ph figcaption{padding:6px 10px;font-size:.74rem;line-height:1.35;color:var(--mut)}
.ph figcaption a{color:var(--brand);font-weight:700}

/* feedback e carimbo */
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:2px solid;animation:pp .35s}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.fb-h h3{font-size:1.2rem;line-height:1.2;flex:1;min-width:10ch}
.stamp{display:inline-block;padding:4px 10px;border:3px double currentColor;border-radius:8px;font:600 .74rem/1.1 var(--mono);letter-spacing:.14em;text-transform:uppercase;transform:rotate(-6deg);animation:st .5s cubic-bezier(.2,1.5,.4,1) both;background:transparent}
.fb.ok .stamp{color:var(--ok)}.fb.no .stamp{color:var(--bad)}
.fb p+p,.fb .chips{margin-top:8px}
.fb .src{font-size:.82rem;color:var(--mut);margin-top:12px}
.fb .pts{font-weight:800}

/* fim, ranking, diário */
.end-top{text-align:center}
.end-top .emb{width:84px;height:84px;margin:0 auto 6px;display:block}
.end-top h2{font-size:1.7rem}
.stars{font-size:1.7rem;color:var(--amber);letter-spacing:5px;margin-top:2px}
.stars span{color:var(--line)}
.score{font:900 2.6rem/1.1 var(--serif);margin-top:4px}
.score small{font:600 1rem var(--mono);color:var(--mut)}
.rv{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rv+.rv{margin-top:8px}
.rv p{font-size:.92rem;margin-top:3px}
.form{display:grid;gap:10px;margin-top:6px}
.inp{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:99px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:.9rem}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
table.rk{width:100%;border-collapse:collapse}
.rk th{font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 8px}
.rk td{padding:9px 8px;border-top:1px solid var(--line)}
.rk td.n{font-weight:800;overflow-wrap:anywhere}
.rk td.num{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.rk th.num{text-align:right}
.rk tr.me td{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.rk .pos{width:2.4em;font-family:var(--mono);font-weight:600}
.empty{padding:18px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:12px}

function dist(a,b){let s=0;for(let i=0;i<12;i++)s+=((a.t[i]-b.t[i])/10)**2+((a.P[i]-b.P[i])/100)**2;return s}
// Nunca inclui respostas de rodadas anteriores (evita eliminação por exclusão).
function choices(c,used,lv){
  const cand=C.filter(x=>x!==c&&!used.includes(x)).map(x=>({x,d:dist(c,x)})).sort((a,b)=>a.d-b.d),m=cand.length;
  let pick=[];
  if(lv==="dificil"){
    pick=sh(cand.slice(0,Math.min(6,m)).map(o=>o.x)).slice(0,3);
  }else{
    const start=lv==="facil"?Math.floor(m*.4):Math.max(3,Math.floor(m*.1));
    const pool=sh(cand.slice(Math.min(start,m-3)).map(o=>o.x));
    // alternativas de tipos de clima diferentes e sem gráficos parecidos entre si
    for(const tau of [12,5,0]){
      for(const x of pool){
        if(pick.length>=3)break;
        if(!pick.includes(x)&&x.k!==c.k&&pick.every(y=>y.k!==x.k&&dist(x,y)>=tau))pick.push(x);
      }
    }
    for(const x of pool){if(pick.length>=3)break;if(!pick.includes(x))pick.push(x)}
  }
  return sh([c,...pick]);
}

/* ---------- gráfico ---------- */
function axes(c){
  const mt=Math.min(...c.t),Mt=Math.max(...c.t),mp=Math.max(...c.P);
  const lo=Math.floor(Math.min(0,mt)/10)*10;
  let hi=Math.ceil((Mt+1)/10)*10;hi=Math.max(hi,lo+30);
  const n=(hi-lo)/10,step=[25,50,100,150,200].find(s=>s*n>=mp*1.02)||250;
  return {lo,hi,n,step};
}
function chartSVG(c,W,still){
  const H=Math.round(Math.min(380,Math.max(230,W*.62))),L=38,R=42,T=24,B=24,w=W-L-R,h=H-T-B,bw=w/12;
  const A=axes(c),ty=v=>T+h*(1-(v-A.lo)/(A.hi-A.lo)),py=v=>T+h*(1-v/(A.step*A.n)),lab=bw>=27?M3:M1;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="${still?"still":""}" role="img" aria-label="Climograma: barras de precipitação e linha de temperatura média, mês a mês"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rain2)"/><stop offset="1" style="stop-color:var(--rain)"/></linearGradient></defs>`;
  for(let i=0;i<=A.n;i++){
    const y=T+h*(1-i/A.n);
    s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${A.lo+i*10}</text><text x="${W-R+6}" y="${y+4}">${i*A.step}</text>`;
  }
  if(A.lo<0)s+=`<line class="gz" x1="${L}" x2="${W-R}" y1="${ty(0)}" y2="${ty(0)}"/>`;
  s+=`<text class="tc" x="${L-6}" y="12" text-anchor="end">°C</text><text class="pc" x="${W-R+6}" y="12">mm</text>`;
  s+=`<line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${T+h}"/><line class="ax" x1="${W-R}" x2="${W-R}" y1="${T}" y2="${T+h}"/>`;
  c.P.forEach((v,i)=>{
    const y=py(v),x=L+i*bw;
    s+=`<rect class="hl" data-i="${i}" x="${x}" y="${T}" width="${bw}" height="${h}"/>`;
    if(v>0)s+=`<rect class="bar" style="animation-delay:${i*45}ms" x="${x+bw*.15}" y="${y}" width="${bw*.7}" height="${Math.max(1,T+h-y)}" fill="url(#gb)" rx="3"/>`;
    s+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${lab[i]}</text>`;
  });
  const pts=c.t.map((v,i)=>[L+i*bw+bw/2,ty(v)]);
  s+=`<polyline class="ln" pathLength="1" points="${pts.map(p=>p.map(v=>Math.round(v*10)/10).join(",")).join(" ")}" fill="none" stroke="var(--temp)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="dt" style="animation-delay:${550+i*45}ms" cx="${p[0]}" cy="${p[1]}" r="4.4" fill="var(--temp)" stroke="var(--card)" stroke-width="2"/>`});
  return {svg:s+`</svg>`,L,bw,W};
}

  if(!G||G.done)return;
  G.done=true;stopTimer();
  const c=G.r[G.i],o=k>=0?G.o[k]:null,ok=o===c,late=k<0;
  const bonus=ok&&G.tm?Math.round(5*G.left/G.tot):0,base=ok?(G.hint?5:10):0,pts=base+bonus;
  G.s+=pts;
  if(ok){G.ok++;G.st++;G.bs=Math.max(G.bs,G.st);boom();if(!ST.diary.includes(c.n)){ST.diary.push(c.n);svS()}}
  else{G.st=0;G.miss.push({c,o,late})}
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled=true;
    if(G.o[j]===c)b.classList.add("ok");else if(j===k)b.classList.add("no");else b.classList.add("dim");
  });
  $("#hb").disabled=true;$("#sc").textContent=G.s;
  const st=$("#st");st.hidden=!(G.st>1);st.querySelector("b").textContent=G.st;
  const stamp=ok?"Encontrada":late?"Tempo esgotado":"Não era";
  const msg=ok?`${OKS[G.i%4]} <span class="pts">+${pts} pontos${bonus?` (${base} + ${bonus} de bônus de velocidade)`:""}</span>`
    :late?"O tempo acabou. Veja o que denunciava o clima desta cidade:":`Você marcou ${esc(o.n)}. Veja o que denunciava o clima desta cidade:`;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="fb-h"><span class="stamp">${stamp}</span><h3>${esc(c.n)} · ${esc(c.p)}</h3></div>
  <p>${msg}</p><p>${esc(c.d)}</p>
  <div class="chips"><span class="chip">🌡️ ${f1(c.avg)} °C por ano</span><span class="chip">↕️ amplitude de ${f1(c.amp)} °C</span><span class="chip">🌧️ ${f0(c.tot)} mm por ano</span></div>
  <p class="src"><b>Clima:</b> ${esc(c.z)}.<br><b>Fonte:</b> ${esc(c.src)}.</p></div>
  <button class="btn big" id="nx" onclick="next()">${G.i+1<G.r.length?"Próxima ficha":"Ver resultado"}</button>`;
  const nx=$("#nx");nx.focus({preventScroll:true});
  $("#fb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
/* sair no meio da expedição (pede um segundo toque para confirmar) */
function quit(){
  const b=$("#xt");if(!b||!G)return;
  if(!QT){b.classList.add("ask");b.textContent="Sair? Toque de novo";QT=setTimeout(()=>{QT=0;const x=$("#xt");if(x){x.classList.remove("ask");x.textContent="✕"}},3500);return}
  clearTimeout(QT);QT=0;view("home");window.scrollTo({top:0});
}
function next(){G.i++;G.i<G.r.length?(round(),window.scrollTo({top:0,behavior:"smooth"})):end()}

/* ---------- fim de jogo e ranking ---------- */
function rankTitle(p){return p>=.9?["Mestre dos Climas","Gabaritou os mapas do tempo!"]:p>=.7?["Meteorologista","Você lê o clima como poucos."]:p>=.4?["Explorador","Bom caminho! Mais uma expedição?"]:["Aprendiz de nuvem","Todo climatologista começou assim."]}
function board(key){return (ST.board[key]||[]).slice().sort((a,b)=>b.s-a.s||b.ok-a.ok||a.d-b.d)}
function end(){
  document.body.dataset.v="end";document.body.classList.remove("compact");
  const n=G.r.length,acc=G.ok/n,mx=maxPts(G.lv,G.tm),rt=rankTitle(acc),key=cat(G.lv,G.tm);
  const st=Math.round(acc*5);
  G.nb=G.s>0&&!(ST.rec[key]>=G.s);if(G.nb){ST.rec[key]=G.s;svS()}
  G.saved=false;
  $("#app").innerHTML=`<div class="grid2 home">
  <section class="card end-top"><span class="lab">Relatório da expedição</span>${embSVG()}<h2>${rt[0]}</h2><p class="mu">${rt[1]}</p>
    <p class="stars">${"★".repeat(st)}<span>${"★".repeat(5-st)}</span></p>
    <p class="score">${G.s}<small> / ${mx} pontos</small></p>
    <p class="mu small mono">${LV[G.lv].n.toUpperCase()}${G.tm?" · COM CRONÔMETRO":""} · ${G.ok} DE ${n} CIDADES · SEQUÊNCIA MÁX. ${G.bs}</p>
    ${G.nb?`<p style="margin-top:8px;font-weight:800">🎉 Novo recorde neste nível!</p>`:""}
    <div class="row c" style="margin-top:16px"><button class="btn" onclick="start()">Nova expedição</button><button class="btn ghost" onclick="view('home')">Trocar de nível</button></div>
  </section>
  <div class="stack">
  <section class="card" id="save"><span class="lab">Quadro de honra</span>
    <h2>Registre seu nome</h2>
    <div class="form"><input class="inp" id="nick" maxlength="14" placeholder="Seu apelido" autocomplete="off" value="${esc(ST.nick||"")}" aria-label="Apelido para o ranking">
      ${SH&&SH.cw!==false?`<label class="chk"><input type="checkbox" id="shr" checked> Também no ranking compartilhado</label>`:""}
      <div class="row"><button class="btn" onclick="saveScore()">Salvar no ranking</button><button class="btn ghost" onclick="showBoard()">Só ver o ranking</button></div></div>
    <div id="bd"></div>
  </section>
  <section class="card"><span class="lab">Para rever</span>
    ${G.miss.length?G.miss.map(m=>`<div class="rv"><b>${esc(m.c.n)}</b> <span class="mu small">(${m.late?"tempo esgotado":"você marcou "+esc(m.o.n)})</span><p>${esc(m.c.d)}</p></div>`).join(""):`<p>Nenhum erro. Perfeito!</p>`}
  </section></div></div>`;
  if(acc>=.7)boom();window.scrollTo({top:0});
}
function sanitize(s){return String(s||"").replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,14)}
function saveScore(){
  if(G.saved)return;
  const nm=sanitize($("#nick").value)||"Anônimo",key=cat(G.lv,G.tm);
  ST.nick=nm;const e={n:nm,s:G.s,ok:G.ok,q:G.r.length,d:Date.now()};
  (ST.board[key]=ST.board[key]||[]).push(e);
  ST.board[key]=board(key).slice(0,30);svS();G.saved=true;G.me=e;
  const shr=$("#shr");let note="Salvo neste aparelho.";
  $("#save .form").innerHTML=`<p class="mu small" id="sn">${note}</p>`;
  if(shr&&shr.checked&&SH){
    saveShared(key,e).then(()=>{const n=$("#sn");if(n)n.textContent="Salvo neste aparelho e no ranking compartilhado."}).catch(()=>{const n=$("#sn");if(n)n.textContent="Salvo neste aparelho. Não foi possível salvar no ranking compartilhado."});
  }
  showBoard();
}
function showBoard(){
  const key=cat(G.lv,G.tm);
  $("#bd").innerHTML=`<div style="margin-top:12px">${tableHTML(board(key).slice(0,10),G.me)}</div>`;
}
function tableHTML(rows,me,max){
  if(!rows.length)return `<div class="empty">Ainda não há pontuações aqui. Que tal ser a primeira?</div>`;
  const med=["🥇","🥈","🥉"];
  return `<table class="rk"><thead><tr><th class="pos">#</th><th>Jogador</th><th class="num">Pontos</th><th class="num">Acertos</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.me||(me&&r.d===me.d&&r.n===me.n)?"me":""}"><td class="pos">${med[i]||i+1}</td><td class="n">${esc(r.n)}</td><td class="num">${r.s}</td><td class="num">${r.ok}/${r.q}</td></tr>`).join("")}</tbody></table>`;
}
async function saveShared(key,e){
  const ref=SH.db.collection("ranking").doc(SH.uid),sn=await ref.get(),cur=(sn.exists&&sn.data())||{},cats={...(cur.cats||{})},old=cats[key];
  if(!old||e.s>old.s)cats[key]={s:e.s,ok:e.ok,q:e.q,d:e.d};
  await ref.set({name:e.n,cats});
}
async function loadShared(key){
  const sn=await SH.db.collection("ranking").limit(500).get(),rows=[];
  sn.docs.forEach(d=>{const v=d.data();if(v&&v.cats&&v.cats[key])rows.push({n:String(v.name||"?").slice(0,14),s:+v.cats[key].s||0,ok:+v.cats[key].ok||0,q:+v.cats[key].q||0,d:+v.cats[key].d||0,me:d.id===SH.uid})});
  return rows.sort((a,b)=>b.s-a.s||b.ok-a.ok||a.d-b.d).slice(0,10);
}
let clr=0;
function rankView(){
  document.body.classList.remove("compact");
  const key=cat(RK.lvl,RK.timer);
  $("#app").innerHTML=`<section class="card"><span class="lab">Quadro de honra</span><h2>Melhores expedições</h2>
    <div class="tabs" role="group" aria-label="Nível">${Object.keys(LV).map(k=>`<button class="tab" aria-pressed="${RK.lvl==k}" onclick="RK.lvl='${k}';rankView()">${LV[k].n}</button>`).join("")}</div>
    <div class="tabs" role="group" aria-label="Modo"><button class="tab" aria-pressed="${!RK.timer}" onclick="RK.timer=false;rankView()">Sem cronômetro</button><button class="tab" aria-pressed="${RK.timer}" onclick="RK.timer=true;rankView()">Com cronômetro</button></div>
    ${SH?`<div class="tabs" role="group" aria-label="Onde"><button class="tab" aria-pressed="${RK.src=="local"}" onclick="RK.src='local';rankView()">Neste aparelho</button><button class="tab" aria-pressed="${RK.src=="shared"}" onclick="RK.src='shared';rankView()">Compartilhado</button></div>`:""}
    <div id="rkb"></div>
    <p class="mu small" style="margin-top:12px">${RK.src=="shared"&&SH?"O ranking compartilhado reúne quem jogou com acesso a esta página no Claude.":"Este ranking fica salvo apenas neste aparelho e navegador."} Pontuação máxima: ${maxPts(RK.lvl,RK.timer)}.</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost sm" onclick="view('home')">← Voltar</button>${RK.src=="local"?`<button class="btn ghost sm" id="cl" onclick="clearBoard()">Limpar ranking deste aparelho</button>`:""}</div>
  </section>`;
  if(RK.src=="shared"&&SH){
    $("#rkb").innerHTML=`<div class="empty">Carregando…</div>`;
    loadShared(key).then(r=>{if($("#rkb"))$("#rkb").innerHTML=tableHTML(r)}).catch(()=>{if($("#rkb"))$("#rkb").innerHTML=`<div class="empty">Não foi possível carregar o ranking compartilhado agora.</div>`});
  }else $("#rkb").innerHTML=tableHTML(board(key).slice(0,10));
}
function clearBoard(){
  const b=$("#cl");if(!b)return;
  if(!clr){b.textContent="Tem certeza? Toque de novo";clr=setTimeout(()=>{clr=0;if($("#cl"))$("#cl").textContent="Limpar ranking deste aparelho"},4000);return}
  clearTimeout(clr);clr=0;ST.board={};svS();rankView();
}

/* ---------- diário de campo ---------- */
function diaryView(){
  document.body.classList.remove("compact");
  const got=new Set(ST.diary),td=C.filter(c=>got.has(c.n)).length;
  $("#app").innerHTML=`<section class="card"><span class="lab">Diário de campo</span><h2>${td} de ${C.length} cidades descobertas</h2>
    <p class="mu">Acerte uma cidade para registrá-la aqui. As que faltam aparecem com o continente onde ficam.</p>
    <div class="pbar" style="margin:10px 0 4px"><i style="width:${Math.round(100*td/C.length)}%"></i></div>
    ${CONTS.map(ct=>{const L=C.filter(c=>c.ct===ct).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR")),g=L.filter(c=>got.has(c.n)).length;
      return `<div class="cont"><h3>${ct}<span>${g}/${L.length}</span></h3><div class="chips">${L.map(c=>got.has(c.n)?`<span class="city on">${esc(c.n)}<small>${esc(c.k)}</small></span>`:`<span class="city off">???</span>`).join("")}</div></div>`}).join("")}
    <div class="row" style="margin-top:20px"><button class="btn ghost sm" onclick="view('home')">← Voltar</button></div></section>`;
}

document.addEventListener("keydown",e=>{
  if(!G||document.body.dataset.v!=="play"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target&&e.target.tagName==="INPUT")return;
  const kk=e.key.toLowerCase();let k="abcd".indexOf(kk);if(k<0)k="1234".indexOf(e.key);
  if(!G.done&&k>=0&&k<G.o.length){pick(k);return}
  if(!G.done&&kk==="h"){hint();return}
  if(e.key==="Enter"&&G.done&&e.target.tagName!=="BUTTON"){const b=$("#nx");if(b)b.click()}
});
view("home");
</script>
</body></html>
